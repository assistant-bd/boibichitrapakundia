<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেসার্স বই বিচিত্রা - অনলাইন বুক শপ</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs (Compat version for single-file web app) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary-color: #1e3a8a;
            --accent-color: #f59e0b;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btns {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .cart-btn, .admin-btn {
            background: var(--accent-color);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .admin-btn {
            background: #059669;
        }

        .cart-count {
            background: red;
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 12px;
            position: absolute;
            top: -5px;
            right: -5px;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .search-bar {
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
        }

        .search-bar input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .product-title {
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .product-price {
            color: #d97706;
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .add-cart-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }

        /* Modal Box */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .submit-order-btn {
            background-color: #059669;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        /* Admin Orders Table */
        .order-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: #f1f5f9;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 8px;
            margin-bottom: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-book-open"></i> মেসার্স বই বিচিত্রা
        </div>
        <div class="nav-btns">
            <button class="cart-btn" onclick="openCartModal()">
                <i class="fa-solid fa-cart-shopping"></i> কার্ট
                <span class="cart-count" id="cartCount">0</span>
            </button>
            <button class="admin-btn" onclick="openAdminModal()">
                <i class="fa-solid fa-user-shield"></i> এডমিন প্যানেল
            </button>
        </div>
    </header>

    <div class="container">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="বইয়ের নাম দিয়ে সার্চ করুন..." onkeyup="filterProducts()">
        </div>

        <div class="product-grid" id="productGrid">
            <!-- Products will load dynamically -->
        </div>
    </div>

    <!-- Cart / Order Modal -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCartModal()">&times;</span>
            <h2><i class="fa-solid fa-basket-shopping"></i> আপনার শপিং কার্ট</h2>
            <div id="cartItemsList"></div>
            <h3 style="text-align: right; margin-top: 15px;">সর্বমোট: <span id="totalPrice">0</span> টাকা</h3>
            <hr>
            <h3>অর্ডার এরিয়া (আপনার তথ্য দিন)</h3>
            <form id="orderForm" onsubmit="handleOrderSubmit(event)">
                <div class="form-group">
                    <label>আপনার নাম *</label>
                    <input type="text" id="custName" required placeholder="উদাহরণ: মো: রহিম">
                </div>
                <div class="form-group">
                    <label>মোবাইল নম্বর *</label>
                    <input type="tel" id="custPhone" required placeholder="017xxxxxxxx">
                </div>
                <div class="form-group">
                    <label>পূর্ণাঙ্গ ডেলিভারি ঠিকানা *</label>
                    <textarea id="custAddress" rows="3" required placeholder="গ্রাম/মহল্লা, থানা, জেলা..."></textarea>
                </div>
                <div class="form-group">
                    <label>পেমেন্ট পদ্ধতি</label>
                    <select id="payMethod">
                        <option value="Cash on Delivery">ক্যাশ অন ডেলিভারি (পণ্য পেয়ে টাকা দিন)</option>
                        <option value="bKash/Nagad">বিকাশ / নগদ (অগ্রিম)</option>
                    </select>
                </div>
                <button type="submit" class="submit-order-btn" id="orderSubmitBtn">অর্ডার নিশ্চিত করুন</button>
            </form>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content" style="max-width: 700px;">
            <span class="close-btn" onclick="closeAdminModal()">&times;</span>
            <h2><i class="fa-solid fa-boxes-packing"></i> এডমিন ড্যাশবোর্ড (লাইভ অর্ডারসমূহ)</h2>
            <p style="font-size: 13px; color: #64748b;">ফায়ারবেস ডাটাবেসে আসা সর্বশেষ অর্ডারগুলোর তালিকা নিচে দেওয়া হলো:</p>
            <div id="adminOrdersList">
                <p style="text-align: center;">অর্ডার লোড হচ্ছে...</p>
            </div>
        </div>
    </div>

    <script>
        // ১. ফায়ারবেস কনফিগারেশন সেটআপ
        const firebaseConfig = {
            apiKey: "AIzaSyIwTmROHmNdkjGwTDFNZMvTp4w1Lu7pmvQ",
            authDomain: "my-project-7d1fa.firebaseapp.com",
            projectId: "my-project-7d1fa",
            storageBucket: "my-project-7d1fa.firebasestorage.app",
            messagingSenderId: "548682566998",
            appId: "1:548682566998:web:0a4a60fabb04a1b01b8bc9",
            measurementId: "G-QDHRF8SFWQ"
        };

        // Firebase ইনিশিয়ালাইজ
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // প্রাথমিক প্রোডাক্ট ডেটা
        const sampleProducts = [
            { id: 1, name: "বাংলা ব্যাকরণ ও নির্মিতি", price: 250, img: "https://via.placeholder.com/200x180?text=Bangla+Book" },
            { id: 2, name: "ইংরেজি গ্রামার মাস্টার", price: 320, img: "https://via.placeholder.com/200x180?text=English+Book" },
            { id: 3, name: "গণিত সমাধান (৯ম-১০ম)", price: 280, img: "https://via.placeholder.com/200x180?text=Math+Book" },
            { id: 4, name: "সাধারণ জ্ঞান বাংলাদেশ ও বিশ্ব", price: 200, img: "https://via.placeholder.com/200x180?text=GK+Book" }
        ];

        let cart = [];

        // প্রোডাক্ট লোড করা
        function renderProducts(productsToRender = sampleProducts) {
            const grid = document.getElementById("productGrid");
            grid.innerHTML = "";
            productsToRender.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div>
                            <img src="${p.img}" alt="${p.name}">
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">৳ ${p.price}</div>
                        </div>
                        <button class="add-cart-btn" onclick="addToCart(${p.id})">
                            <i class="fa-solid fa-plus"></i> কার্টে যোগ করুন
                        </button>
                    </div>
                `;
            });
        }

        // সার্চ ফিল্টার
        function filterProducts() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = sampleProducts.filter(p => p.name.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        // কার্টে যোগ
        function addToCart(productId) {
            const product = sampleProducts.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCartUI();
            alert(`${product.name} কার্টে যোগ করা হয়েছে!`);
        }

        function updateCartUI() {
            const cartCount = document.getElementById("cartCount");
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            cartCount.innerText = totalQty;
        }

        // কার্ট মোডাল ওপেন
        function openCartModal() {
            const modal = document.getElementById("cartModal");
            const itemsContainer = document.getElementById("cartItemsList");
            const totalPriceEl = document.getElementById("totalPrice");

            itemsContainer.innerHTML = "";
            let total = 0;

            if (cart.length === 0) {
                itemsContainer.innerHTML = "<p>আপনার কার্ট বর্তমানে খালি রয়েছে।</p>";
            } else {
                cart.forEach(item => {
                    const subtotal = item.price * item.qty;
                    total += subtotal;
                    itemsContainer.innerHTML += `
                        <div style="display:flex; justify-between; align-items:center; margin-bottom:10px;">
                            <div>
                                <strong>${item.name}</strong><br>
                                ৳ ${item.price} x ${item.qty}
                            </div>
                            <div><strong>৳ ${subtotal}</strong></div>
                        </div>
                    `;
                });
            }

            totalPriceEl.innerText = total;
            modal.style.display = "flex";
        }

        function closeCartModal() {
            document.getElementById("cartModal").style.display = "none";
        }

        // ফায়ারবেসে অর্ডার পাঠানো
        function handleOrderSubmit(event) {
            event.preventDefault();
            if (cart.length === 0) {
                alert("আপনার কার্ট খালি! অনুগ্রহ করে অন্তত একটি পণ্য যোগ করুন।");
                return;
            }

            const btn = document.getElementById("orderSubmitBtn");
            btn.disabled = true;
            btn.innerText = "অর্ডার প্রসেস হচ্ছে...";

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            
            const orderData = {
                customerName: document.getElementById("custName").value,
                phone: document.getElementById("custPhone").value,
                address: document.getElementById("custAddress").value,
                paymentMethod: document.getElementById("payMethod").value,
                cartItems: cart,
                totalAmount: total,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                status: "Pending"
            };

            // Firestore "orders" কালেকশনে সেভ করা
            db.collection("orders").add(orderData)
            .then((docRef) => {
                alert("ধন্যবাদ! আপনার অর্ডারটি সফলভাবে গ্রহণে হয়েছে।
অর্ডার আইডি: " + docRef.id);
                cart = [];
                updateCartUI();
                closeCartModal();
                document.getElementById("orderForm").reset();
            })
            .catch((error) => {
                console.error("Error submitting order: ", error);
                alert("অর্ডার পাঠাতে সমস্যা হয়েছে। আবার চেষ্টা করুন।");
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "অর্ডার নিশ্চিত করুন";
            });
        }

        // এডমিন মোডাল ও লাইভ অর্ডার দেখা
        function openAdminModal() {
            document.getElementById("adminModal").style.display = "flex";
            loadAdminOrders();
        }

        function closeAdminModal() {
            document.getElementById("adminModal").style.display = "none";
        }

        function loadAdminOrders() {
            const listContainer = document.getElementById("adminOrdersList");
            
            // রিয়েল-টাইম ফায়ারবেস লিসেনার
            db.collection("orders").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    listContainer.innerHTML = "<p>এখনো পর্যন্ত কোনো অর্ডার পাওয়া যায়নি।</p>";
                    return;
                }

                listContainer.innerHTML = "";
                snapshot.forEach(doc => {
                    const order = doc.data();
                    let itemsHtml = order.cartItems ? order.cartItems.map(i => `${i.name} (x${i.qty})`).join(", ") : "N/A";
                    
                    listContainer.innerHTML += `
                        <div class="order-card">
                            <div class="order-header">
                                <span>ID: ${doc.id.substring(0,8)}...</span>
                                <span style="color: #059669;">${order.status || 'Pending'}</span>
                            </div>
                            <div><strong>গ্রাহক:</strong> ${order.customerName}</div>
                            <div><strong>ফোন:</strong> ${order.phone}</div>
                            <div><strong>ঠিকানা:</strong> ${order.address}</div>
                            <div><strong>পণ্যসমূহ:</strong> ${itemsHtml}</div>
                            <div><strong>মোট টাকা:</strong> ৳ ${order.totalAmount} (${order.paymentMethod})</div>
                        </div>
                    `;
                });
            }, (error) => {
                console.error("Error fetching orders: ", error);
                listContainer.innerHTML = "<p style='color:red;'>অর্ডার লোড করতে ব্যর্থ হয়েছে। ফায়ারবেস রুলস চেক করুন।</p>";
            });
        }

        // পেজ লোড হলে
        window.onload = function() {
            renderProducts();
        };
    </script>
</body>
</html>
