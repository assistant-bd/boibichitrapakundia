<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>মেসার্স বই বিচিত্রা</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --primary:#f85606;
      --primary-dark:#dd4a00;
      --primary-soft:#fff3ed;
      --surface:#ffffff;
      --bg:#f4f6fb;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --success:#16a34a;
      --warning:#f59e0b;
      --danger:#dc2626;
      --shadow:0 10px 22px rgba(15, 23, 42, 0.08);
      --radius:20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', 'Noto Serif Bengali', sans-serif; }
    html { scroll-behavior: smooth; }
    body {
      background: linear-gradient(180deg, #f7f8fc 0%, #eef2f9 100%);
      color: var(--text);
      padding-bottom: 110px;
    }
    a { text-decoration: none; }

    .main-header {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      padding: 12px 4%;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 2px 12px rgba(17,24,39,0.06);
      border-bottom: 1px solid rgba(229,231,235,0.7);
    }
    .header-top-row {
      display: flex; align-items: center; justify-content: space-between; width: 100%;
    }
    .logo-area { display: flex; align-items: center; gap: 10px; }
    .brand-title {
      font-family: 'Noto Serif Bengali', serif;
      font-size: clamp(1.4rem, 3vw, 1.8rem);
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.2px;
    }
    .header-icon-btn {
      background: var(--primary-soft);
      color: var(--primary);
      border: none;
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(248,86,6,0.08);
      transition: all 0.2s ease;
    }
    .header-icon-btn:hover {
      background: var(--primary);
      color: #fff;
      transform: translateY(-1px);
    }

    .contact-dropdown-container { position: relative; }
    .contact-menu {
      display: none; position: absolute; top: 54px; right: 0;
      background: #fff; box-shadow: 0 18px 38px rgba(17,24,39,0.12);
      border-radius: 16px; width: 190px; padding: 8px 0; z-index: 1100;
      border: 1px solid var(--line);
    }
    .contact-menu.show { display: block; }
    .contact-menu-item {
      display: flex; align-items: center; gap: 10px; padding: 11px 16px;
      color: var(--text); font-size: 13px; font-weight: 600;
      transition: 0.2s ease;
    }
    .contact-menu-item:hover { background: var(--primary-soft); color: var(--primary); }
    .call-icon { color: var(--primary); }
    .wa-icon { color: #25D366; }

    .search-shell {
      margin: 12px 4% 0;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(229,231,235,0.9);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
    }
    .search-shell .field-wrap { position: relative; width: 100%; }
    .search-shell input {
      width: 100%; padding: 12px 14px 12px 38px; border: 1px solid rgba(248,86,6,0.35);
      border-radius: 12px; font-size: 13px; outline: none; background: #fff;
    }
    .search-shell i {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--primary); font-size: 12px;
    }

    .categories-title {
      margin: 18px 4% 8px; font-size: 14px; font-weight: 800; color: var(--primary);
    }
    .categories {
      display: flex; gap: 10px; overflow-x: auto; padding: 4px 4% 18px; scrollbar-width: none;
    }
    .cat-card {
      background: #fff; border-radius: 999px; padding: 10px 18px; white-space: nowrap; box-shadow: 0 3px 12px rgba(15,23,42,0.04);
      border: 1px solid var(--line); font-size: 13px; font-weight: 700; color: #3b4251; cursor: pointer;
      transition: all 0.2s ease;
    }
    .cat-card:hover { border-color: rgba(248,86,6,0.5); color: var(--primary); }
    .cat-card.active { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; border-color: transparent; }

    .products-section { margin: 0 4% 20px; }
    .product-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .product-card {
      background: #fff; border-radius: 18px; padding: 12px; text-align: center; border: 1px solid rgba(229,231,235,0.9);
      box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between; position: relative;
      overflow: hidden;
    }
    .product-card:hover { transform: translateY(-2px); box-shadow: 0 16px 26px rgba(15,23,42,0.08); }
    .discount-badge {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; font-size: 10px; font-weight: 800;
      padding: 5px 8px; border-radius: 999px; display: inline-block; margin-bottom: 8px; align-self: flex-start;
    }
    .product-title {
      font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 8px; height: 38px; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-align: left;
    }
    .product-card img {
      width: 100%; height: 160px; object-fit: contain; display: block; margin: 0 auto 10px auto; border-radius: 12px;
      background: linear-gradient(180deg, #fff, #f8fafc);
      border: 1px solid rgba(229,231,235,0.8);
    }
    .product-price-area { margin-bottom: 10px; text-align: left; }
    .product-price { color: var(--primary); font-weight: 800; font-size: 15px; }
    .original-price { text-decoration: line-through; color: #9aa4b2; font-size: 11px; margin-right: 4px; }

    .btn-action {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff; border: none; padding: 10px 0; width: 100%; border-radius: 12px; cursor: pointer;
      font-size: 13px; font-weight: 700; transition: all 0.2s ease; box-shadow: 0 10px 20px rgba(248,86,6,0.2);
    }
    .btn-action:hover { opacity: 0.96; transform: translateY(-1px); }
    .btn-add-cart { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); }

    .cart-item-row {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 6px;
    }
    .cart-qty-ctrl {
      display: flex; align-items: center; gap: 10px; background: #f8fafc; padding: 3px 8px; border-radius: 8px; border: 1px solid #e5e7eb;
    }
    .cart-qty-btn {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; border: none; width: 26px; height: 26px; border-radius: 6px;
      font-weight: big; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .cart-qty-btn:hover { filter: brightness(0.96); }

    .site-footer {
      background: linear-gradient(180deg, #1e293b 0%, #111827 100%); color: #cbd5e1; padding: 22px 4% 18px; margin-top: 32px;
      border-top: 4px solid var(--primary);
    }
    .footer-slim-container {
      max-width: 1000px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    }
    .footer-brand { display: flex; align-items: center; gap: 8px; }
    .footer-brand i { color: var(--primary); font-size: 16px; }
    .footer-shop-title { color: #fff; font-size: 15px; font-weight: 800; font-family: 'Noto Serif Bengali', serif; }
    .footer-info-group { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .footer-info-inline { display: flex; align-items: center; gap: 6px; color: #cbd5e1; font-size: 12px; }
    .footer-info-inline i { color: var(--primary); font-size: 13px; }
    .footer-copyright-slim { width: 100%; text-align: center; padding-top: 10px; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.12); font-size: 11px; color: #a8b0bf; }

    #admin-panel-view { display: none; padding: 15px 4%; }
    .dashboard-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
      background: #fff; padding: 15px; border-radius: 18px; box-shadow: 0 8px 16px rgba(15,23,42,0.04);
    }
    .admin-section-box {
      background: #fff; border-radius: 18px; padding: 16px; margin-bottom: 16px; box-shadow: 0 8px 16px rgba(15,23,42,0.04);
      border: 1px solid var(--line);
    }
    .admin-section-title {
      font-size: 14px; font-weight: 800; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #f1f1f1; padding-bottom: 8px;
    }
    .admin-nav-tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 6px; }
    .tab-btn {
      background: #fff; border: 1px solid #dfe3eb; padding: 9px 15px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #4b5563; cursor: pointer; white-space: nowrap;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff; border-color: transparent;
    }
    .admin-prod-item {
      display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #f1f1f1; font-size: 12px;
    }
    .admin-prod-item img { width: 55px; height: 55px; object-fit: contain; border-radius: 10px; background: #fff; border: 1px solid #eee; }
    .order-card-admin {
      border: 1px solid #e5e7eb; border-radius: 16px; padding: 12px; margin-bottom: 14px; background: #fafbff;
      box-shadow: 0 8px 20px rgba(15,23,42,0.03);
    }
    .order-header-row {
      display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px; margin-bottom: 8px;
    }
    .badge-status { padding: 4px 8px; border-radius: 999px; font-size: 10px; font-weight: 800; }
    .status-pending { background: #fff7db; color: #b26b00; }
    .status-delivered { background: #e8f9ee; color: #166534; }
    .order-details-p { font-size: 12px; color: #475569; margin-bottom: 4px; }
    .admin-order-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px dashed #dcdcdc; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,0.68); display: none; justify-content: center; align-items: flex-start;
      z-index: 2000; backdrop-filter: blur(4px); padding: 18px; overflow-y: auto;
    }
    .modal-body {
      background: #fff; width: 100%; max-width: 480px; border-radius: 22px; padding: 22px; position: relative; box-shadow: 0 28px 52px rgba(15,23,42,0.18); margin-bottom: 50px;
      border: 1px solid rgba(229,231,235,0.9);
    }
    .modal-header-premium {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; padding: 14px 18px; border-radius: 14px;
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; box-shadow: 0 12px 24px rgba(248,86,6,0.18);
    }
    .modal-header-premium h3 { font-size: 16px; font-weight: 800; }
    .close-btn-prm {
      background: rgba(255,255,255,0.18); border: none; width: 30px; height: 30px; border-radius: 50%; color: #fff; cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
    }

    .account-modal-body { background: #fff; border-radius: 18px; padding: 20px; box-shadow: 0 18px 44px rgba(15,23,42,0.14); border: 1px solid #e5e7eb; }
    .account-options-grid { display: flex; flex-direction: row; gap: 10px; margin-top: 12px; }
    .account-option-card-row {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px 10px;
      background: linear-gradient(180deg, #ffffff 0%, #fafbff 100%); border: 1px solid var(--line); border-radius: 16px; cursor: pointer;
      transition: all 0.2s ease;
    }
    .account-option-card-row:hover { border-color: rgba(248,86,6,0.5); background: #fff6f1; transform: translateY(-1px); }
    .account-option-card-row .icon-box {
      width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 8px;
    }
    .account-option-card-row strong { font-size: 13px; color: var(--text); font-weight: 800; display: block; }
    .account-option-card-row small { font-size: 10px; color: var(--muted); margin-top: 2px; display: block; }
    .acc-user-icon { background: #e8f7ee; color: #198754; }
    .acc-admin-icon { background: #fff7df; color: #b26b00; }

    .login-hero-header { text-align: center; margin-bottom: 16px; }
    .login-hero-icon {
      width: 56px; height: 56px; background: linear-gradient(135deg, #fff5f0 0%, #fff2e1 100%); color: var(--primary); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 10px; box-shadow: inset 0 0 0 1px rgba(248,86,6,0.08);
    }
    .login-hero-title { font-size: 20px; font-weight: 800; color: var(--text); }
    .login-hero-subtitle { font-size: 11px; color: var(--muted); }

    .premium-input-wrapper { position: relative; margin-bottom: 12px; }
    .premium-input-wrapper i {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #99a3b2; font-size: 14px;
    }
    .premium-input-wrapper .custom-input {
      padding-left: 42px; height: 44px; border-radius: 12px; border: 1px solid #dde3ee; background: #fafbff; transition: all 0.2s ease;
    }
    .premium-input-wrapper .custom-input:focus {
      border-color: rgba(248,86,6,0.7); background: #fff; box-shadow: 0 0 0 4px rgba(248,86,6,0.08);
    }

    .btn-premium-submit {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; border: none; height: 46px; width: 100%;
      border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 800; box-shadow: 0 12px 22px rgba(248,86,6,0.22);
      transition: all 0.2s ease;
    }
    .btn-premium-submit:hover { transform: translateY(-1px); }

    .custom-input {
      width: 100%; padding: 10px 12px; border: 1px solid #dfe3eb; border-radius: 12px; font-size: 13px; color: var(--text);
      outline: none; background-color: #fafbff; transition: all 0.2s ease;
    }
    .custom-input:focus { border-color: rgba(248,86,6,0.7); background-color: #fff; box-shadow: 0 0 0 4px rgba(248,86,6,0.08); }
    .form-group-custom { margin-bottom: 14px; text-align: left; }
    .form-group-custom label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 6px; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%; background-color: rgba(255,255,255,0.96); backdrop-filter: blur(12px);
      display: flex; justify-content: space-around; align-items: center; padding: 10px 0 14px; box-shadow: 0 -8px 24px rgba(15,23,42,0.08);
      z-index: 1000; border-top: 1px solid rgba(229,231,235,0.9);
    }
    .bottom-nav-item {
      display: flex; flex-direction: column; align-items: center; color: #788394; text-decoration: none; font-size: 11px; font-weight: 700;
      background: none; border: none; cursor: pointer; width: 25%; position: relative; gap: 4px;
    }
    .bottom-nav-item i { font-size: 20px; }
    .bottom-nav-item.active { color: var(--primary); transform: translateY(-1px); }
    .cart-badge {
      position: absolute; top: -4px; right: 28%; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border-radius: 50%;
      padding: 2px 6px; font-size: 10px; font-weight: 800; box-shadow: 0 6px 12px rgba(248,86,6,0.2);
    }

    .toast-notification {
      position: fixed; top: 20px; right: 20px; background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; padding: 10px 18px; border-radius: 12px;
      font-size: 12px; font-weight: 700; box-shadow: 0 12px 24px rgba(22,163,74,0.22); display: flex; align-items: center; gap: 8px;
      z-index: 9999; transform: translateY(-50px); opacity: 0; transition: all 0.3s ease;
    }
    .toast-notification.show { transform: translateY(0); opacity: 1; }

    .btn-small { padding: 5px 10px; font-size: 11px; border-radius: 8px; border: none; cursor: pointer; color: white; font-weight: 700; }
    .btn-edit { background-color: #0284c7; }
    .btn-delete { background-color: #c62828; }
    .btn-success { background-color: #2e7d32; }

    .premium-alert-box { text-align: center; padding: 10px 5px; }
    .premium-alert-icon { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 15px auto; }
    .premium-alert-icon.info { background: #e3f2fd; color: #1976d2; }
    .premium-alert-icon.success { background: #e8f5e9; color: #2e7d32; }
    .premium-alert-icon.warning { background: #fff8e1; color: #f57f17; }
    .premium-alert-icon.danger { background: #ffebee; color: #c62828; }
    .premium-alert-title { font-size: 18px; font-weight: 800; color: #212121; margin-bottom: 8px; }
    .premium-alert-msg { font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.5; }
    .premium-alert-actions { display: flex; gap: 10px; justify-content: center; }

    .admin-login-btn-small {
      background: transparent; border: none; color: var(--primary); font-size: 11px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 8px;
    }

    @media (max-width: 600px) {
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .footer-slim-container { flex-direction: column; text-align: center; justify-content: center; }
      .footer-info-group { justify-content: center; gap: 12px; }
    }
  </style>
</head>
<body>

  <div id="toast" class="toast-notification">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toast-msg">অপারেশন সফল হয়েছে!</span>
  </div>

  <header class="main-header">
    <div class="header-top-row">
      <button class="header-icon-btn" onclick="openCategoryModal()" title="Categories">
        <i class="fa-solid fa-layer-group"></i>
      </button>

      <div class="logo-area">
        <h1 class="brand-title" id="header-shop-name">মেসার্স বই বিচিত্রা</h1>
      </div>

      <div class="contact-dropdown-container">
        <button class="header-icon-btn" onclick="toggleContactMenu()" title="যোগাযোগ করুন">
          <i class="fa-solid fa-headset"></i>
        </button>
        <div class="contact-menu" id="contact-menu-box">
          <a href="tel:01783480895" id="call-link" class="contact-menu-item">
            <i class="fa-solid fa-phone call-icon"></i> Call
          </a>
          <a href="https://wa.me/8801783480895" id="wa-link" target="_blank" class="contact-menu-item">
            <i class="fa-brands fa-whatsapp wa-icon"></i> WhatsApp
          </a>
        </div>
      </div>
    </div>
  </header>

  <div id="user-store-view">
    <div class="search-shell">
      <div class="field-wrap">
        <input type="text" id="store-search-input" oninput="handleSearchProducts(this.value)" placeholder="Search">
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
    </div>

    <h3 class="categories-title">Categories</h3>
    <div class="categories" id="categories-list"></div>

    <div class="products-section">
      <div class="product-grid" id="product-grid-container"></div>
    </div>

    <footer class="site-footer">
      <div class="footer-slim-contain
